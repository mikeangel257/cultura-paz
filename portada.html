
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Código Humano | Portada</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background-image:
                linear-gradient(
                    rgba(19, 27, 39, 0.42),
                    rgba(19, 27, 39, 0.60)
                ),
                url("portada.jpg");

            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        /* CONTENEDOR PRINCIPAL */

        .portada {
            width: 100%;
            max-width: 950px;

            background: rgba(255, 255, 255, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 35px;

            padding: 55px 45px;

            text-align: center;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            animation: aparecer 1s ease;
        }

        /* ETIQUETA */

        .etiqueta {
            display: inline-block;

            background-color: #e6f5eb;
            color: #48745c;

            padding: 10px 22px;
            border-radius: 30px;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;

            margin-bottom: 25px;
        }

        /* TÍTULO */

        h1 {
            font-size: clamp(38px, 7vw, 75px);

            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.15;

            color: #624e78;

            margin-bottom: 20px;
        }

        /* LÍNEA DECORATIVA */

        .linea {
            width: 110px;
            height: 6px;

            background: linear-gradient(
                to right,
                #a7dcc4,
                #b9a2df,
                #efc0a4
            );

            border-radius: 30px;
            margin: 0 auto 25px;
        }

        /* SUBTÍTULO */

        .subtitulo {
            font-size: clamp(17px, 2.5vw, 25px);

            font-weight: 600;
            color: #705d83;

            margin-bottom: 15px;
        }

        /* DESCRIPCIÓN */

        .descripcion {
            font-size: 16px;
            color: #555b65;

            max-width: 700px;
            margin: 0 auto 25px;

            line-height: 1.9;
        }

        /* INFORMACIÓN ESCOLAR */

        .informacion {
            background: linear-gradient(
                135deg,
                #e8f7ee,
                #f0eafb
            );

            border-radius: 22px;

            padding: 20px;
            margin: 25px auto 30px;

            max-width: 650px;
        }

        .informacion p {
            font-size: 14px;
            color: #5c5368;
            margin: 6px 0;
        }

        /* BOTÓN */

        .boton-comenzar {
            display: inline-block;

            background: linear-gradient(
                135deg,
                #7966a0,
                #9b80c5
            );

            color: white;
            text-decoration: none;

            padding: 17px 38px;

            border-radius: 40px;

            font-size: 16px;
            font-weight: 700;

            box-shadow: 0 8px 20px rgba(121, 102, 160, 0.3);

            transition: all 0.3s ease;
        }

        .boton-comenzar:hover {
            transform: translateY(-5px) scale(1.03);

            background: linear-gradient(
                135deg,
                #65518e,
                #846ab0
            );

            box-shadow: 0 12px 25px rgba(121, 102, 160, 0.4);
        }

        /* PIE DE PORTADA */

        .pie {
            margin-top: 30px;

            font-size: 13px;
            color: #777080;
        }

        /* ANIMACIÓN */

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CELULARES */

        @media (max-width: 600px) {

            body {
                padding: 15px;
                background-attachment: scroll;
            }

            .portada {
                padding: 35px 22px;
                border-radius: 25px;
            }

            h1 {
                letter-spacing: 1px;
            }

            .descripcion {
                font-size: 14px;
            }

            .informacion {
                padding: 15px;
            }

            .boton-comenzar {
                width: 100%;
                padding: 16px 20px;
            }
        }

    </style>
</head>

<body>

    <!-- PORTADA PRINCIPAL -->

    <main class="portada">

        <span class="etiqueta">
            CECyTE 24 | CULTURA DE LA PAZ
        </span>

        <h1>
            CÓDIGO HUMANO
        </h1>

        <div class="linea"></div>

        <p class="subtitulo">
            Programando Rutas de Paz
            para mi Bienestar Integral
        </p>

        

        <div class="informacion">

            <p>
                <strong>Institución:</strong>
                CECyTE 24
            </p>

            <p>
                <strong>Proyecto:</strong>
                PAEC - Cultura de la Paz
            </p>

            <p>
                <strong>Dimensión:</strong>
                Académica
            </p>

            <p>
                <strong>Desarrollado por:</strong>
                Ortega Perez Miguel Angel
            </p>

        </div>

        <!-- BOTÓN PARA ENTRAR A LA PÁGINA -->

        <a href="inicio.html" class="boton-comenzar">
            Comenzar mi ruta →
        </a>

        <p class="pie">
            La paz también se programa.
        </p>

    </main>

</body>
</html>
